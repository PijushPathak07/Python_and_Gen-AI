version: "3.9"

services:
  finsight-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsight_ai_engine
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/finsight.db
    volumes:
      - finsight_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  finsight_data: